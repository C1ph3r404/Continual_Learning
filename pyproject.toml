[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "continual_brain"
version = "0.1.0"
description = "Modular Brain-Inspired Continual Learning Architecture (Text-First Core)"
readme = "docs/Brain.md"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "numpy",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]
